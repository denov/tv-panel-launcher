name: Build

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: "ubuntu-latest"
    name: Tests, lint and build
    steps:
      - name: Check out the repository
        uses: "actions/checkout@v4"

      - name: Set up JDK 17
        uses: "actions/setup-java@v4"
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Unit tests, lint and build
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Install script syntax
        run: bash -n build-and-install.sh
